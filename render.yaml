services:
  - type: worker
    name: elitetrade-demo-worker
    runtime: node
    # Always-on background workers have no free compute tier.
    # Render starter compute: $7/month (check dashboard before Apply).
    plan: 0.5c-512mb
    region: frankfurt
    repo: https://github.com/Mahiruni/Elitetrade
    branch: main
    numInstances: 1
    autoDeployTrigger: commit
    buildCommand: npm ci
    startCommand: npm run worker:demo
    maxShutdownDelaySeconds: 180
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: SUPABASE_URL
        value: https://cgpvhayfwnpipktyltho.supabase.co
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: METAAPI_TOKEN
        sync: false
      - key: METAAPI_REGION
        sync: false
      - key: DEMO_EXECUTION_ENABLED
        value: "true"
