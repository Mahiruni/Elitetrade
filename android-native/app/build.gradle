plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}
def liveOrigin = providers.gradleProperty('eliteTradeOrigin').orElse('https://elitetradee.vercel.app').get()
if (!liveOrigin.startsWith('https://') || liveOrigin.endsWith('/')) {
    throw new GradleException('eliteTradeOrigin must be an HTTPS origin without a trailing slash')
}
android {
    namespace 'com.elitetrade.android'
    compileSdk 36
    defaultConfig {
        applicationId 'com.elitetrade.android'
        minSdk 26
        targetSdk 36
        versionCode 2
        versionName '0.2.0'
        buildConfigField 'String', 'WEB_ORIGIN', '"' + liveOrigin + '"'
    }
    buildFeatures { buildConfig true; compose true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
    buildTypes {
        debug {
            debuggable true
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
        release {
            minifyEnabled false
            debuggable false
            // A protected release-signing setup is required before production distribution.
        }
    }
}
dependencies {
    implementation platform('androidx.compose:compose-bom:2025.09.00')
    implementation 'androidx.activity:activity-compose:1.11.0'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'
    debugImplementation 'androidx.compose.ui:ui-tooling'
}
