name: EliteBridge Phase 7 Windows MT5 adapter lab

on:
  pull_request:
    paths:
      - "companion/mt5_readonly_probe.py"
      - "src/elitebridge-mt5-terminal-companion.mjs"
      - "scripts/elitebridge-mt5-probe.mjs"
      - "test/test_elitebridge_mt5_readonly.py"
      - "test/elitebridge-phase7-mt5-companion.test.mjs"
      - "test/elitebridge-own-token-health.test.mjs"
      - "src/elitebridge-own-token-health-client.mjs"
      - "scripts/elitebridge-own-token-check.mjs"
      - "scripts/elitebridge-windows-demo-probe.ps1"
      - "scripts/elitebridge-windows-vps-preflight.ps1"
      - "test/elitebridge-windows-vps-preflight.test.mjs"
      - "docs/ELITEBRIDGE_WINDOWS_VPS_RUNBOOK.md"
      - "docs/ELITEBRIDGE_TERMINAL_COMPANION.md"
      - ".github/workflows/elitebridge-phase7-mt5-lab.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mt5-companion-lab:
    name: mt5-companion-lab
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24.12.0"
      - name: Verify DEMO-only Python MT5 adapter with injected responses (no real terminal)
        run: python -m unittest discover -s test -p 'test_elitebridge_mt5_readonly.py' -v
      - name: Verify Ed25519 packet bridge and no execution methods
        run: node --test test/elitebridge-phase7-mt5-companion.test.mjs
      - name: Verify self-issued read-only token status HTTP safety
        run: node --test test/elitebridge-own-token-health.test.mjs
      - name: Audit Windows VPS prerequisites (no broker terminal or network required)
        if: runner.os == 'Windows'
        shell: pwsh
        run: pwsh -NoProfile -File ./scripts/elitebridge-windows-vps-preflight.ps1 -Mode Audit
      - name: Verify read-only VPS preflight and setup guardrails
        run: node --test test/elitebridge-windows-vps-preflight.test.mjs
