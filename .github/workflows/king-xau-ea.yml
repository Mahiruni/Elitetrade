name: King XAU EA build
on:
  pull_request:
    paths:
      - 'ea/king-xau/**'
      - '.github/workflows/king-xau-ea.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  numeric-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Compile and run shared risk arithmetic checks
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -Werror ea/king-xau/tests/risk_tests.cpp -o /tmp/king-xau-tests
          /tmp/king-xau-tests
      - name: Compile and run rolling quote-window checks
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -Werror ea/king-xau/tests/tick_tests.cpp -o /tmp/king-xau-ticks
          /tmp/king-xau-ticks
      - name: Verify gold symbol metadata guard
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -Werror ea/king-xau/tests/symbol_tests.cpp -o /tmp/king-xau-symbols
          /tmp/king-xau-symbols
      - name: Check preset matches every EA input
        run: python3 ea/king-xau/tests/check_preset.py
  compile:
    needs: numeric-tests
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install official MetaEditor and compile
        shell: pwsh
        run: ./ea/king-xau/build/compile.ps1
      - name: Upload verified EA delivery package
        uses: actions/upload-artifact@v4
        with:
          name: King_of_Scalper_XAU_Package
          path: |
            ea/king-xau/*.mq5
            ea/king-xau/*.mqh
            ea/king-xau/*.ex5
            ea/king-xau/*.set
            ea/king-xau/*.log
            ea/king-xau/*.md
          if-no-files-found: error
          retention-days: 30
      - name: Preserve source and compiler evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: King_XAU_source_and_build_logs
          path: |
            ea/king-xau/*.mq5
            ea/king-xau/*.mqh
            ea/king-xau/*.set
            ea/king-xau/*.log
            ea/king-xau/*.md
          retention-days: 30
