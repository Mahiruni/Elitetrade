name: EliteTrade Android debug APK
on:
  pull_request:
    paths:
      - 'android-native/**'
      - '.github/workflows/android-debug.yml'
  push:
    branches: [main, 'feat/android-premium-shell-2026']
    paths:
      - 'android-native/**'
      - '.github/workflows/android-debug.yml'
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Rebuild reviewed Claude Pro web and bundled Android assets
        run: |
          npm ci
          npm run build
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install Android SDK 36
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Assemble debug APK
        working-directory: android-native
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: elitetrade-android-debug-apk
          path: android-native/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
