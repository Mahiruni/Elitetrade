name: EliteBridge real PostgreSQL integration

on:
  pull_request:
    paths:
      - "db/elitebridge-standalone.sql"
      - "src/elitebridge-standalone-store.mjs"
      - "src/elitebridge-registry.mjs"
      - "src/elitebridge-protocol.mjs"
      - "test/elitebridge-postgres.integration.mjs"
      - ".github/workflows/elitebridge-postgres.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres-integration:
    name: postgres-integration
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: elitebridge_ci
          POSTGRES_PASSWORD: disposable_ci_password
          POSTGRES_DB: elitebridge_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U elitebridge_ci -d elitebridge_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      ELITEBRIDGE_TEST_DATABASE_URL: postgresql://elitebridge_ci:disposable_ci_password@127.0.0.1:5432/elitebridge_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.12.0"
          cache: npm
      - name: Install existing application dependencies
        run: npm ci
      - name: Install PostgreSQL test driver into CI only
        run: npm install --no-save --package-lock=false --ignore-scripts pg@8.16.3
      - name: Validate against disposable PostgreSQL 16
        run: node --test test/elitebridge-postgres.integration.mjs
