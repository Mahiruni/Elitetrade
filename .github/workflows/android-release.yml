name: EliteTrade signed Android releases

# Native main-branch changes publish a signed, versioned APK after signing
# secrets are configured. Never build publishable APKs from pull requests.
on:
  push:
    branches: [main]
    paths:
      - 'android-native/**'
      - '.github/workflows/android-release.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: elite-android-releases
  cancel-in-progress: false

jobs:
  signed-release:
    name: Build and publish signed release APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: Install Android SDK 36
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Prepare protected Android signing credentials
        env:
          ENCODED_KEYSTORE: ${{ secrets.ELITETRADE_ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ELITETRADE_ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ELITETRADE_ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ELITETRADE_ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$ENCODED_KEYSTORE" || -z "$STORE_PASSWORD" || -z "$KEY_ALIAS" || -z "$KEY_PASSWORD" ]]; then
            echo "::error::The 4 protected Android signing secrets must be configured before safe in-place updates can be published."
            echo "::error::See android-native/RELEASE_UPDATES.md. Never commit a keystore or password."
            exit 1
          fi
          printf '%s' "$ENCODED_KEYSTORE" | base64 --decode > "$RUNNER_TEMP/elitetrade-signing.jks"
          chmod 600 "$RUNNER_TEMP/elitetrade-signing.jks"
          echo "ELITETRADE_KEYSTORE_PATH=$RUNNER_TEMP/elitetrade-signing.jks" >> "$GITHUB_ENV"
          echo "ELITETRADE_KEYSTORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ELITETRADE_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "ELITETRADE_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
      - name: Build versioned signed release
        working-directory: android-native
        env:
          RELEASE_BUILD: ${{ github.run_number }}
        shell: bash
        run: |
          set -euo pipefail
          CODE=$((200000 + RELEASE_BUILD))
          gradle :app:assembleRelease --no-daemon --stacktrace \
            "-PeliteTradeVersionCode=$CODE" \
            "-PeliteTradeVersionName=1.0.$RELEASE_BUILD"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose \
            app/build/outputs/apk/release/app-release.apk
          mkdir -p "$RUNNER_TEMP/elitetrade-publish"
          cp app/build/outputs/apk/release/app-release.apk \
            "$RUNNER_TEMP/elitetrade-publish/elitetrade-release.apk"
          sha256sum "$RUNNER_TEMP/elitetrade-publish/elitetrade-release.apk"
      - name: Publish official APK for automatic update checks
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_BUILD: ${{ github.run_number }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="android-v1.0.$RELEASE_BUILD"
          gh release create "$TAG" \
            "$RUNNER_TEMP/elitetrade-publish/elitetrade-release.apk" \
            --title "EliteTrade Android 1.0.$RELEASE_BUILD" \
            --notes "Signed EliteTrade Android release for secure in-place upgrades. Install over the previous signed production edition to preserve app data. Review the changes in the linked commit." \
            --target "$GITHUB_SHA" \
            --latest
