name: EliteBridge Windows host preflight
on:
  push:
    branches:
      - 'feature/elitebridge-phase9-windows-preflight-20261015'
  pull_request:
permissions:
  contents: read
jobs:
  preflight:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - run: npm ci
      - name: Verify Windows readiness evaluator on Windows
        run: node --test test/elitebridge-windows-readiness.test.mjs
      - name: Run synthetic DEMO/REAL host readiness
        run: npm run bridge:windows:simulate
      - name: Unconfigured Windows runner must fail closed
        shell: pwsh
        run: |
          & node scripts/elitebridge-windows-doctor.mjs
          $result = $LASTEXITCODE
          if ($result -ne 2) {
            throw "Unsafe: unconfigured Windows runner did not fail closed (exit $result)"
          }
          Write-Output "PASS: no MT5/identity configured, Windows checker remains blocked"
          exit 0 # The doctor intentionally returned 2; prevent PowerShell from propagating it.
