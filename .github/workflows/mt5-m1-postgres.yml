name: MT5 M1 isolated PostgreSQL migration rehearsal

on:
  pull_request:
    paths:
      - "supabase/migrations/20261015000400_m1_demo_and_imported_account.sql"
      - "test/mt5-m1-postgres.integration.mjs"
      - ".github/workflows/mt5-m1-postgres.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mt5-m1-sql:
    name: mt5-m1-sql
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mt5_ci
          POSTGRES_PASSWORD: disposable_ci_only
          POSTGRES_DB: mt5_m1_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mt5_ci -d mt5_m1_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      ELITETRADE_M1_CI_POSTGRES_URL: postgresql://mt5_ci:disposable_ci_only@127.0.0.1:5432/mt5_m1_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.12.0"
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Install temporary CI-only PostgreSQL driver
        run: npm install --no-save --package-lock=false --ignore-scripts pg@8.16.3
      - name: Validate actual import/MFA/M1 migration in ephemeral PostgreSQL
        run: node --test test/mt5-m1-postgres.integration.mjs
