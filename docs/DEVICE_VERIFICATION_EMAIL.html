<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Confirm your EliteBot sign-in</title></head>
<body style="margin:0;padding:32px 20px;background:#f4f5f7;color:#172033;font-family:Arial,sans-serif">
  <main style="max-width:480px;margin:auto;padding:32px;background:#fff;border-radius:12px">
    <p style="font-size:16px;font-weight:bold">EliteBot</p>
    <h1 style="font-size:24px">Confirm your sign-in</h1>
    <p>Open this secure link in the browser you are signing in from:</p>
    <p><a href="{{ .ConfirmationURL }}" style="display:inline-block;padding:12px 20px;background:#2454d6;color:#fff;border-radius:8px;text-decoration:none">Verify and continue</a></p>
    <p>Or enter this verification code:</p>
    <p style="font-size:28px;font-weight:bold;letter-spacing:4px">{{ .Token }}</p>
    <p>The link and code expire and can only be used once. If you did not request this sign-in, ignore this email.</p>
  </main>
</body>
</html>
